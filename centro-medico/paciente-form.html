<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro Médico | Paciente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/paciente-form.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                Centro Médico
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="pacientes.html">
                            Pacientes
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main class="container py-5">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h1 class="fw-bold mb-4">
                    Registro de Paciente
                </h1>

                <form>

                    <div class="row g-4">

                        <div class="col-md-4">

                            <label class="form-label">
                                DNI
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingrese DNI">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingrese nombre">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Apellido
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingrese apellido">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Fecha de nacimiento
                            </label>

                            <input
                                type="date"
                                class="form-control">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="381-555-1234">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="correo@email.com">

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Dirección
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingrese dirección">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Obra Social
                            </label>

                            <select class="form-select">

                                <option>Seleccionar</option>
                                <option>OSDE</option>
                                <option>Sancor Salud</option>
                                <option>OSESAC</option>
                                <option>PAMI</option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Nº Afiliado
                            </label>

                            <input
                                type="text"
                                class="form-control">

                        </div>

                    </div>

                    <div class="mt-5 d-flex gap-3">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Guardar

                        </button>

                        <a
                            href="pacientes.html"
                            class="btn btn-outline-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-dark text-white text-center py-3 mt-5">

        <p class="mb-0">
             Centro Médico
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
