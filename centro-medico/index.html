<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro Médico | Iniciar sesión</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


    <main class="login-page">

        <div class="login-brand">

            <img
                src="img/logo.png"
                alt="MedicalCenter">

        </div>

        <div class="login-container">

            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    Centro Médico
                </h1>

                <p class="mb-0">
                    Sistema de Gestión
                </p>

            </div>

            <form>

                <div class="mb-3">

                    <label
                        for="usuario"
                        class="form-label">

                        Usuario

                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        class="form-control"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required>

                </div>

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="recordarme">

                    <label
                        class="form-check-label"
                        for="recordarme">

                        Recordarme

                    </label>

                </div>

                <a
                    href="dashboard.html"
                    class="btn btn-primary">

                    Iniciar sesión

                </a>


            </form>


        </div>


    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>7
